# Install changed tools and publish them to CVMFS, on merge of a PR to the default branch. Success or failure is
# reported back as a comment on the merged PR, since by then nobody is watching the PR's checks.
#
# Retry a failed deploy with Actions -> Deploy tools to CVMFS -> the failed run -> "Re-run failed jobs".
name: Deploy tools to CVMFS

# pull_request_target rather than pull_request: a fork-originated pull_request event gets no secrets and a read-only
# token, so the Stratum 0 key would be empty and the result comment would be refused.
#
# The trust model this establishes is "merged code is trusted code". The classic pull_request_target hazard is a
# privileged workflow checking out an *unmerged* fork branch, and that never happens here: the job only proceeds once
# the PR is merged, so everything it runs -- the workflow, .ci/github-actions.sh, and the tool definitions themselves
# -- has passed branch protection, CODEOWNER review, and the environment's deployment approval. A merged change to
# any of those does run with the publishing credential, which is why /.ci/ and /.github/ have CODEOWNERS.
on:
  pull_request_target:
    types: [closed]
    # "master" is transitional; drop it once the default branch is renamed.
    branches: ["master", "main"]
    paths:
      - 'usegalaxy.org/**'
      - 'test.galaxyproject.org/**'
      - 'cloud/**'

permissions:
  contents: read
  pull-requests: write

# Keep exactly one runner in the cvmfs-publish group. Its normal runner queue preserves every deploy while serializing
# the CVMFS transactions; a concurrency group would discard older pending runs when several PRs merge close together.

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on:
      group: cvmfs-publish
      labels: cvmfs
    # Requests the protected publish environment; its required reviewers are the deployment authorization gate.
    environment: cvmfs-publish
    timeout-minutes: 180
    steps:
      # No ref: actions/checkout refuses to check out a fork PR's head or merge SHA under pull_request_target, and
      # naming the merge commit explicitly is exactly that. The default self-checkout is exempt from the guard and
      # resolves to the base branch, which by this point contains the merge.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The base branch tip is normally the merge commit, but another PR merging at the same moment would leave it
      # one commit further along. Reachability, not equality, is what COMMIT_RANGE below actually requires.
      - name: Verify the merge commit is present
        env:
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git merge-base --is-ancestor "$MERGE_COMMIT_SHA" HEAD \
            || { echo "merge commit $MERGE_COMMIT_SHA is not in the checked out history" >&2; exit 1; }

      - name: Start ssh-agent with the Stratum 0 key
        env:
          STRATUM0_SSH_KEY: ${{ secrets.STRATUM0_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "$STRATUM0_SSH_KEY" | ssh-add -

      - name: Comment that the deploy has started
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `🚀 Deploying tools to CVMFS — [watch progress](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
            });

      - name: Install and publish tools
        env:
          PUBLISH: 'true'
          # The merge commit's first parent is the default branch immediately before the merge, so this is the
          # PR's net change.
          # Correct for both merge commits and squashes; rebase merging must stay disabled for it to hold.
          COMMIT_RANGE: ${{ github.event.pull_request.merge_commit_sha }}^1...${{ github.event.pull_request.merge_commit_sha }}
        run: .ci/github-actions.sh

      - name: Comment the deploy result
        uses: actions/github-script@v9
        if: always()
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ok = '${{ job.status }}' === 'success';
            const body = ok
              ? `✅ Deploy succeeded — [run summary](${url}).`
              : [
                  `❌ **Deploy FAILED** — [run summary](${url}).`,
                  '',
                  'The tools in this PR are merged but may not be installed on CVMFS. Please investigate.',
                  '',
                  'Retry with *Actions → Deploy tools to CVMFS → this run → Re-run failed jobs*. If that is not',
                  'possible, deployment can be re-triggered by opening a new PR that changes the `.lock` file(s)',
                  'modified here (whitespace or ordering is enough).',
                ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

      - name: Stop ssh-agent
        if: always()
        run: ssh-agent -k || true

      # CI_LOG_DIR is exported by .ci/github-actions.sh, so it is unset if the install step never ran. upload-artifact
      # rejects an empty path outright rather than honouring if-no-files-found, which turns any earlier failure into
      # two failures.
      - name: Upload Galaxy log
        uses: actions/upload-artifact@v7
        if: always() && env.CI_LOG_DIR != ''
        with:
          name: galaxy-log
          path: ${{ env.CI_LOG_DIR }}
          if-no-files-found: ignore
